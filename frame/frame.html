
<!-- to create an HTML page with different types of frames such as floating frame, navigation frame -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }
        .ok{
            height: 100%;
            width: 20%;
        }
        .ok2{
            height: 100%;
            width: 80%;;
        }
    </style>
</head> 
<body>
    <iframe name="one" src="navigation.html" class="ok"></iframe>
    <iframe name="two" src="" class="ok2"></iframe>
</body>
</html>
