<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Map</title>
</head>
<body>
    <img src="image.jpg" usemap="#mymap">
    <map name="mymap">
        <area shape="circle" coords="278,243,100" href="https://www.google.com" alt="" title="circle">
        <area shape="rect" coords="478,147,673,341" href="https://www.youtube.com" alt="">
        <area shape="poly" coords="852,140,963,340,761,341" href="https://www.gmail.com" alt="">
        <area shape="rect" coords="373,449,52,601" href="https://www.drive.google.com" alt="">
        <area shape="poly" coords="573,409,685,496,645,629,509,627,465,494" href="https://maps.google.com" alt="">
        <area shape="poly" coords="813,436,917,436,971,519,903,619,819,619,756,524" href="https://instagram.com" alt="">
    </map>
</body>
</html>
