<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stopwatch</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
    }
    #time {
      font-size: 48px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Stopwatch</h1>
  <div id="time">00:00:00</div>

  <button onclick="start()">Start</button>
  <button onclick="pause()">Pause</button>
  <button onclick="reset()">Reset</button>

  <script>
    let timer;
    let milliseconds = 0;
    let seconds = 0;
    let minutes = 0;

    function updateTime() {
      document.getElementById('time').innerText =
        (minutes < 10 ? "0" : "") + minutes + ":" +
        (seconds < 10 ? "0" : "") + seconds + ":" +
        (milliseconds < 10 ? "0" : "") + milliseconds;
    }

    function start() {
      if (!timer) {
        timer = setInterval(() => {
          milliseconds++;
          if (milliseconds >= 100) {
            milliseconds = 0;
            seconds++;
          }
          if (seconds >= 60) {
            seconds = 0;
            minutes++;
          }
          updateTime();
        }, 10); // Update every 10ms
      }
    }

    function pause() {
      clearInterval(timer);
      timer = null;
    }

    function reset() {
      clearInterval(timer);
      timer = null;
      milliseconds = 0;
      seconds = 0;
      minutes = 0;
      updateTime();
    }

    updateTime(); // Initialize
  </script>

</body>
</html>
