<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Calculator</title>
  <style>
    /* Basic styles for the calculator */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .calculator {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    #display {
      width: 100%;
      height: 40px;
      text-align: right;
      padding: 5px;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-gap: 10px;
    }
    .key {
      width: 60px;
      height: 60px;
      font-size: 1.2em;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #e0e0e0;
      transition: background-color 0.2s;
    }
    .key:hover {
      background-color: #d0d0d0;
    }
    .operator {
      background-color: #ff9500;
      color: #fff;
    }
    .equal {
      grid-column: span 2;
      background-color: #00aaff;
      color: #fff;
    }
    .clear {
      grid-column: span 2;
      background-color: #f44336;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="keys">
      <button class="key" onclick="appendValue('7')">7</button>
      <button class="key" onclick="appendValue('8')">8</button>
      <button class="key" onclick="appendValue('9')">9</button>
      <button class="key operator" onclick="appendValue('/')">/</button>

      <button class="key" onclick="appendValue('4')">4</button>
      <button class="key" onclick="appendValue('5')">5</button>
      <button class="key" onclick="appendValue('6')">6</button>
      <button class="key operator" onclick="appendValue('*')">*</button>

      <button class="key" onclick="appendValue('1')">1</button>
      <button class="key" onclick="appendValue('2')">2</button>
      <button class="key" onclick="appendValue('3')">3</button>
      <button class="key operator" onclick="appendValue('-')">-</button>

      <button class="key" onclick="appendValue('0')">0</button>
      <button class="key" onclick="appendValue('.')">.</button>
      <button class="key equal" onclick="calculateResult()">=</button>
      <button class="key operator" onclick="appendValue('+')">+</button>

      <button class="key clear" onclick="clearDisplay()">Clear</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    function appendValue(value) {
      display.value += value;
    }
    function calculateResult() {
      try {
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }    
    function clearDisplay() {
      display.value = '';
    }
  </script>
</body>
</html>
