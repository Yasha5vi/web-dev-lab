<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/anbc" method="get">
        <table>
            <tr>
                <td>Name : </td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Photo : </td>
                <td><input type="file" name="image"></td>
            </tr>
            <tr>
                <td>address</td>
                <td><input type="text" name="address"></td>
            </tr>
            <tr>
                <td>gender</td>
                <td>
                    <input type="radio" name="gender" value="Male"/>Male <br>
                    <input type="radio" name="gender" value="female"/>Female <br>
                    <input type="radio" name="gender" value="other"/>Other
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    <input type="checkbox" name="hobbies" value="coding"> coding <br>
                    <input type="checkbox" name="hobbies" value="playing"> playing
                </td>
            </tr>
            <tr>
                <td>Branch</td>
                <td>
                    <select name="branch">
                        <option>Computer</option>
                        <option>Civil</option>
                        <option>ECE</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>country</td>
                <td><input type="text" list="countries">
                <datalist id="countries">
                    <option value="chrome"></option>
                    <option value="firefox"></option>
                    <option value="google"></option>
                </datalist></td>
            </tr>
            <tr>
                <td>Rate this site</td>
                <td>
                    <input type="number" name="rating" value="5">
                </td>
            </tr>
        </table>
        <button>Submit</button>
        <button>Reset</button>
    </form>
</body>
</html>
